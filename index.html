<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app draws under the iPhone notch and home bar and keeps its own
         content clear of them with the safe-area insets. Pinch zoom stays allowed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Groundhop (nieuwe look)</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /* no white flash around the pitch when the page bounces or a safe area shows */
        background-color: #1b6e38;
        /* iOS enlarges text on its own when the phone turns sideways */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* the app scrolls inside its own lists; the page itself never scrolls or pulls to refresh */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* iOS Safari: 100% can be taller than what is visible while its toolbars show, which hides
         the tab bar behind them; dvh follows the toolbars. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
